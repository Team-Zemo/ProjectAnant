version: "3.9"

services:
  # ── Memgraph MAGE — in-memory graph DB with AML algorithms ────────────────
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: anant-memgraph
    restart: unless-stopped
    ports:
      - "7687:7687"    # Bolt protocol
      - "7444:7444"    # HTTP monitoring
    volumes:
      - /tmp:/data     # CSV edge file written by anant-engine
    environment:
      - MEMGRAPH_STORAGE_MODE=IN_MEMORY_ANALYTICAL
    command: >
      --storage-mode=IN_MEMORY_ANALYTICAL
      --log-level=WARNING
      --memory-limit=2048
    deploy:
      resources:
        limits:
          memory: 2500M

  # ── Memgraph Lab — optional visual query explorer ─────────────────────────
  memgraph-lab:
    image: memgraph/lab:latest
    container_name: anant-memgraph-lab
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      - memgraph
    profiles:
      - lab   # only start with: docker compose --profile lab up

networks:
  default:
    name: anant-network
